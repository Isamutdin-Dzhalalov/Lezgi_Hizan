openapi: 3.0.0
info:
  title: Dating API
  description: API для сайта знакомств
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Продакшн сервер

paths:
  /auth/register:
    post:
      summary: Регистрация пользователя
      description: Регистрирует нового пользователя по email и паролю.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Успешная регистрация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Ошибка валидации

  /auth/login:
    post:
      summary: Авторизация пользователя
      description: Позволяет пользователю войти в систему, используя email и пароль.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Неверные учетные данные

  /auth/logout:
    post:
      summary: Выход из системы
      description: Удаляет refresh_token, чтобы пользователь не мог обновить access_token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешный выход
        '401':
          description: Пользователь не авторизован
  
  /auth/refresh:
    post:
      summary: Обновление access_token
      description: Позволяет получить новый access_token по refresh_token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  example: "dGhpc19pc19hX3JlZnJlc2hfdG9rZW4="
      responses:
        '200':
          description: Успешное обновление
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Неверный или просроченный refresh_token
      

components:
  schemas:
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: P@ssw0rd
        name:
          type: string
          example: Иван

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: P@ssw0rd

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsIn..."
        refresh_token:
          type: string
          example: "dGhpc19pc19hX3JlZnJlc2hfdG9rZW4="
      
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
